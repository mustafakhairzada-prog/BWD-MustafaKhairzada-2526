<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>contact</title>
</head>

<body>
    <header>
        <img src="img/logo.png" width="7%" alt="de logo"><br>
        <a href="index.html">home</a>
        <a href="contact.html">contact</a>
    </header>
    <main>
        <section>
            <h1>Studieplek reserveren</h1>

            <p>
                Wil je een studieplek reserveren in De Leeshoek? Vul het formulier hieronder in en we bevestigen je
                aanvraag
                via
                e-mail.
            </p>

            <h4>Jouw gegevens</h4>
            <label form="naam">Naam *</label>
            <input type="text" id="naam" placeholder="Voornaam Achternaam"><br><br>
            <label for="mail">E-mail *</label>
            <input type="email" id="mail" placeholder="naam@voorbeeld.be"><br><br>
            <label for="datum">Datum *</label>
            <input type="date" id="datum"><br><br>

            <label for="Opmerking">Opmerking *</label>
            <textarea id="Opmerking" cols="50px" rows="2px"></textarea><br><br>

            <label for="akkoord">ik ga akkoord met de afspraken</label>
            <input type="checkbox" id="akkoord"><br><br>

            <button type=" submit">Verzenden</button>
            <button type="reset">Wissen</button>
        </section>
    </main>

    <footer>

        <section>

            <h2>Vind ons</h2>
            <iframe
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2519.290686282323!2d4.357561276934543!3d50.84430115892741!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x47c3c480ee53af83%3A0x72634da1c77e5e29!2sRue%20Baron%20Horta%2C%201000%20Bruxelles!5e0!3m2!1sen!2sbe!4v1773139612681!5m2!1sen!2sbe"
                width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"
                referrerpolicy="no-referrer-when-downgrade"></iframe>

            <address>
                <a href="email:info@leeshoek.tld">info@leeshoek.tld</a>
                <a href="tel:+320123400000">0123/40.00.00</a><br>
                <p>&COPY; Stadsbibliotheek De Leeshoek — Alle rechten voorbehouden</p>
            </address>
        </section>
    </footer>

</body>

</html>
